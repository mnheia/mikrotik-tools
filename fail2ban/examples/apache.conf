# Example Apache/PHP jails using the MikroTik action.
#
# Copy or adapt this file under:
#   /etc/fail2ban/jail.d/apache.conf
#
# Confirm that the log paths match your Apache installation.

[apache-auth]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
           /var/log/apache2/*/error_log
action   = mikrotik

[apache-badbots]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/access.log
           /var/log/apache2/*/access_log
bantime  = 48h
maxretry = 1
action   = mikrotik

[apache-noscript]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
           /var/log/apache2/*/error_log
action   = mikrotik

[apache-overflows]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
           /var/log/apache2/*/error_log
maxretry = 2
action   = mikrotik

[apache-nohome]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
           /var/log/apache2/*/error_log
maxretry = 2
action   = mikrotik

[apache-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
           /var/log/apache2/*/error_log
maxretry = 2
action   = mikrotik

[apache-shellshock]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
           /var/log/apache2/*/error_log
maxretry = 1
action   = mikrotik

[php-url-fopen]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/access.log
           /var/log/apache2/*/access_log
maxretry = 1
action   = mikrotik
