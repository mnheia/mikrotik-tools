# Example Fail2ban action for MikroTik RouterOS
#
# Copy to:
#   /etc/fail2ban/action.d/mikrotik.conf
#
# Adjust the helper path if installed elsewhere.

[Definition]

actionstart =
actionstop =
actioncheck =

# Entries expire automatically in RouterOS, so actionunban is intentionally empty.
actionban = /usr/local/sbin/mikrotik-fail2ban.sh "/ip firewall address-list add list=threat address=<ip> timeout=1d"

actionunban =
